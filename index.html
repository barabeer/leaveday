<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base target="_top">
  </head>
  <body>
    <iframe id="leaveFrame"
      style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
      src="">
    </iframe>

    <script>
      const BASE_URL = "https://script.google.com/macros/s/AKfycbzBP9jqD5fyUKiZptVVwW_oAIA4G1cFRZdQtkAs_6ceBKmS_7btWXuR8jPAmm0I7KYLsQ/exec";

      // รับ ?empId=XXXX จาก URL ของหน้านี้ แล้วส่งต่อเข้า iframe
      const empId = new URLSearchParams(window.location.search).get('empId') || '';
      const url   = empId
        ? BASE_URL + '?empId=' + encodeURIComponent(empId)
        : BASE_URL;

      document.getElementById('leaveFrame').src = url;
    </script>
  </body>
</html>
